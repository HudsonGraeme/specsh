name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: Build ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: macos-latest, target: aarch64-apple-darwin, use-cross: false }
          - { os: macos-latest, target: x86_64-apple-darwin, use-cross: false }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, use-cross: false }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, use-cross: true }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Install cross
        if: matrix.job.use-cross
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: cross

      - name: Build
        run: |
          if [ "${{ matrix.job.use-cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.job.target }}
          else
            cargo build --release --locked --target ${{ matrix.job.target }}
          fi

      - name: Archive
        id: archive
        run: |
          NAME="specsh-${{ matrix.job.target }}"
          mkdir -p "$NAME"
          cp "target/${{ matrix.job.target }}/release/specsh" "$NAME/"
          cp README.md "$NAME/"
          tar -czf "${NAME}.tar.gz" "$NAME"
          echo "archive=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.job.target }}
          path: ${{ steps.archive.outputs.archive }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: artifacts/*.tar.gz

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            artifacts/*.tar.gz artifacts/SHA256SUMS
